<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minha Evolução | Bem-estar</title><style>
:root{--green:#294d40;--sage:#dce9df;--mint:#edf5ef;--bg:#f7f7f2;--ink:#243b32;--muted:#78867d;--line:#e5eae4;--white:#fff;--accent:#9dbba4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:254px;background:#fff;border-right:1px solid var(--line);padding:27px 17px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-size:24px;font-weight:800;color:var(--green);margin:5px 12px 35px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#8ba094;font-weight:600;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#64786b;padding:13px 14px;text-align:left;border-radius:12px;font-weight:600}.nav button.active,.nav button:hover{background:var(--mint);color:var(--green)}.sidebarfoot{font-size:12px;color:#89978d;line-height:1.6;position:absolute;bottom:25px;padding:0 13px;max-width:215px}main{flex:1;min-width:0;padding:34px clamp(18px,4vw,65px);max-width:1500px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{color:#91a299;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:clamp(26px,3vw,36px);margin:7px 0 4px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 17px}h3{font-size:15px;margin:0 0 12px}.sub{color:var(--muted);margin:0}.avatar{width:43px;height:43px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-weight:800;color:var(--green)}.hero{background:linear-gradient(110deg,#294d40,#47705b);color:white;padding:30px 34px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.hero h2{font-size:26px;margin:5px 0 8px}.hero p{color:#d8e8dc;margin:0}.hero .symbol{font-size:72px;opacity:.8}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.two{grid-template-columns:1.5fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}.statlabel{color:var(--muted);font-size:13px}.statvalue{font-size:30px;font-weight:800;margin:11px 0 5px;letter-spacing:-1px}.statfoot{font-size:12px;color:#7a9b85}.pill{background:var(--mint);color:var(--green);padding:6px 11px;border-radius:100px;font-size:12px;font-weight:700}.btn{border:0;border-radius:11px;background:var(--green);color:white;padding:11px 16px;font-weight:700}.btn.secondary{background:var(--mint);color:var(--green)}.btn.ghost{background:#fff;color:#a33;border:1px solid #edd}.btn.small{padding:7px 11px;font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:var(--muted)}.progress{height:10px;background:#e9eee8;border-radius:20px;overflow:hidden;margin:16px 0 7px}.progress>div{height:100%;background:#719e80;border-radius:20px;transition:width .3s}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item small{display:block;color:var(--muted);margin-top:3px}.item strong{font-size:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#6c8074}.field input,.field select,.field textarea{border:1px solid #dfe8df;border-radius:10px;padding:11px 12px;background:#fcfdfb;color:var(--ink);width:100%;min-width:0}.field textarea{min-height:76px}.span2{grid-column:span 2}.formgrid button{justify-self:start}.section{display:none}.section.active{display:block}.section>.grid,.section>.card{margin-top:17px}.chart{width:100%;height:215px}.chart text{fill:#86988c;font-size:11px}.empty{color:var(--muted);padding:24px 0;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);min-height:82px;border-radius:10px;padding:8px;font-size:13px;background:#fff}.day.dim{opacity:.3}.day.today{border-color:#77a58b;background:#f0f8f1}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:9px}.dot{width:7px;height:7px;border-radius:50%;background:#77a58b}.dot.pink{background:#d6a98b}.dot.blue{background:#84a5d3}.notice{padding:15px 18px;border-radius:12px;background:#f2f6ef;color:#5c7565;font-size:13px;line-height:1.5;margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.sectionhead h2{margin:0}.hidden{display:none!important}.mini{font-size:12px}.badge{display:inline-block;padding:6px 10px;background:#edf5ef;border-radius:10px;color:#497657;font-weight:700;font-size:12px}.dark{--bg:#16241e;--white:#23362c;--ink:#ecf3eb;--muted:#b3c2b7;--line:#3b5344;--mint:#355342;--sage:#3b5d4b}.dark .sidebar,.dark .card,.dark .day{background:#23362c}.dark .field input,.dark .field select,.dark .field textarea{background:#1a2b21;color:#fff;border-color:#47604e}.dark .nav button{color:#c3d2c6}.dark .item{background:#263b30}.dark .notice{background:#314638;color:#d4e5d6}@media(max-width:1000px){.sidebar{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){.layout{display:block}.sidebar{height:auto;width:100%;position:sticky;z-index:4;padding:10px;background:#fff}.brand{font-size:18px;margin:2px 8px 10px}.brand small,.sidebarfoot{display:none}.nav{display:flex;overflow-x:auto;gap:3px}.nav button{white-space:nowrap;font-size:12px;padding:9px 10px}main{padding:20px 14px 60px}.stats,.three{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:17px}.hero{padding:22px}.hero .symbol{display:none}.statvalue{font-size:24px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.day{min-height:58px;padding:5px;font-size:11px}.calendar{gap:3px}}@media print{.sidebar,.actions,.btn,form,.top .avatar{display:none!important}.section{display:block!important;break-before:page}body{background:white}main{padding:0}.card{break-inside:avoid}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">✳ Minha Evolução<small>SEU ESPAÇO DE BEM-ESTAR</small></div><nav class="nav" id="nav"></nav><div class="sidebarfoot">Seu progresso é único. Pequenos passos também são conquistas. 🌿</div></aside><main><div class="top"><div><div class="eyebrow" id="datehead"></div><h1 id="pagetitle">Olá! 🌿</h1><p class="sub" id="pagesub">Seu espaço para cuidar de você.</p></div><div class="actions"><button class="btn secondary small" id="theme" onclick="toggleTheme()">☾ Tema</button><div class="avatar" id="avatar">EU</div></div></div><div id="content"></div></main></div><script>
const KEY='minha-evolucao-v1';const today=()=>new Date().toLocaleDateString('en-CA');const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';const num=x=>Number(x)||0;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const defaults={profile:{name:'',height:'',initial:'',goal:'',waterGoal:2000},weights:[],meals:[],water:[],workouts:[],doses:[],symptoms:[],events:[],measurements:[],theme:'light'};let db;try{db={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=structuredClone(defaults)};let tab='inicio',calOffset=0;const menus=[['inicio','⌂ Início','Seu resumo de hoje'],['evolucao','↗ Minha evolução','Acompanhe suas mudanças'],['dieta','♧ Minha dieta','Seu diário alimentar'],['agua','◉ Minha água','Hidratação diária'],['treinos','♟ Meus treinos','Movimente-se no seu ritmo'],['tratamento','✚ Meu tratamento','Registros do tratamento prescrito'],['calendario','▦ Calendário','Sua rotina organizada'],['conquistas','✦ Conquistas','Celebre sua constância'],['relatorios','▤ Relatórios','Seus dados reunidos'],['perfil','⚙ Meu perfil','Personalize seu acompanhamento']];function save(){localStorage.setItem(KEY,JSON.stringify(db))}function go(t){tab=t;render();window.scrollTo(0,0)}function add(kind,form){const f=new FormData(form),o={id:crypto.randomUUID()};for(const [k,v] of f)o[k]=v;db[kind].push(o);save();render();}function remove(kind,id){if(!confirm('Excluir este registro?'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}function val(v,s=''){return v!==undefined&&v!==''?safe(v)+s:'—'}function input(label,name,type='text',required=false,extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${required?'required':''} ${extra}></div>`}function select(label,name,values){return `<div class="field"><label>${label}</label><select name="${name}">${values.map(v=>`<option>${v}</option>`).join('')}</select></div>`}function form(kind,fields,button='Adicionar registro'){return `<form class="formgrid" onsubmit="event.preventDefault();add('${kind}',this)">${fields}<button class="btn" type="submit">+ ${button}</button></form>`}function entries(kind,fn){return db[kind].length?`<div class="list">${[...db[kind]].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="item"><div>${fn(x)}</div><button class="btn ghost small" onclick="remove('${kind}','${x.id}')">Excluir</button></div>`).join('')}</div>`:'<div class="empty">Nenhum registro ainda. Comece adicionando o primeiro! 🌱</div>'}function card(title,body,extra=''){return `<div class="card"><div class="sectionhead"><h2>${title}</h2>${extra}</div>${body}</div>`}function metric(title,value,foot){return `<div class="card"><div class="statlabel">${title}</div><div class="statvalue">${value}</div><div class="statfoot">${foot}</div></div>`}function waterToday(){return db.water.filter(x=>x.date===today()).reduce((a,x)=>a+num(x.ml),0)}function currentWeight(){const w=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date));return w.length?num(w.at(-1).kg):num(db.profile.initial)}function chart(){const arr=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date));if(!arr.length)return '<div class="empty">Registre seu peso para visualizar o gráfico.</div>';const values=arr.map(x=>num(x.kg)),min=Math.min(...values)-2,max=Math.max(...values)+2,w=600,h=190;const points=arr.map((x,i)=>`${45+(i*(w-75)/Math.max(arr.length-1,1))},${20+(max-num(x.kg))/(max-min)*140}`).join(' ');return `<svg class="chart" viewBox="0 0 600 190" preserveAspectRatio="none"><line x1="45" y1="160" x2="590" y2="160" stroke="#dce7dc"/><line x1="45" y1="90" x2="590" y2="90" stroke="#eaf0e9"/><line x1="45" y1="20" x2="590" y2="20" stroke="#eaf0e9"/><text x="0" y="25">${max.toFixed(1)}</text><text x="0" y="95">${((min+max)/2).toFixed(1)}</text><text x="0" y="165">${min.toFixed(1)}</text><polyline points="${points}" fill="none" stroke="#719e80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${arr.map((x,i)=>`<circle cx="${45+i*(w-75)/Math.max(arr.length-1,1)}" cy="${20+(max-num(x.kg))/(max-min)*140}" r="4.5" fill="#294d40"><title>${fmt(x.date)}: ${x.kg} kg</title></circle>`).join('')}</svg>`}function dashboard(){const p=db.profile,initial=num(p.initial),curr=currentWeight(),goal=num(p.goal),lost=initial&&curr?initial-curr:0,progress=initial>goal&&curr?Math.max(0,Math.min(100,(initial-curr)/(initial-goal)*100)):0,water=waterToday(),wg=num(p.waterGoal)||2000;return `<div class="hero"><div><div class="eyebrow" style="color:#b6d1bd">BEM-VIND${p.name?'A':'O'} AO SEU ESPAÇO</div><h2>${p.name?'Olá, '+safe(p.name.split(' ')[0])+'!':'Seu cuidado começa aqui.'} ✨</h2><p>Um dia de cada vez, no seu ritmo e com gentileza.</p></div><div class="symbol">🌿</div></div><div class="grid stats">${metric('Peso atual',curr?curr.toFixed(1)+' kg':'—','Último registro')}${metric('Peso inicial',initial?initial.toFixed(1)+' kg':'—','Ponto de partida')}${metric('Variação',initial&&curr?((lost>=0?'−':'+')+Math.abs(lost).toFixed(1)+' kg'):'—','Desde o início')}${metric('Meta pessoal',goal?goal.toFixed(1)+' kg':'—','Definida por você')}</div><div class="grid two">${card('Evolução do peso',chart(),'<button class="btn secondary small" onclick="go(\'evolucao\')">Registrar peso</button>')}${card('Progresso da sua meta',`<div style="font-size:33px;font-weight:800">${progress.toFixed(0)}%</div><p class="muted mini">Progresso calculado a partir dos pesos informados</p><div class="progress"><div style="width:${progress}%"></div></div><div class="row mini muted"><span>Início: ${initial||'—'} kg</span><span>Meta: ${goal||'—'} kg</span></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><div class="row"><strong>Água hoje</strong><span>${water} / ${wg} ml</span></div><div class="progress"><div style="width:${Math.min(100,water/wg*100)}%"></div></div><button class="btn secondary small" onclick="go('agua')">+ Registrar água</button>`)}</div><div class="grid three" style="margin-top:17px">${card('🥗 Alimentação',`<p class="muted">${db.meals.filter(x=>x.date===today()).length} refeição(ões) registrada(s) hoje.</p><button class="btn secondary small" onclick="go('dieta')">Abrir diário</button>`)}${card('🏃 Movimento',`<p class="muted">${db.workouts.filter(x=>x.date===today()).length} atividade(s) hoje.</p><button class="btn secondary small" onclick="go('treinos')">Meus treinos</button>`)}${card('💚 Tratamento',`<p class="muted">${db.doses.length} aplicação(ões) registrada(s).</p><button class="btn secondary small" onclick="go('tratamento')">Meu diário</button>`)}</div>${!p.name?`<div class="notice">💡 Comece preenchendo seu <a href="#" onclick="go('perfil');return false">perfil</a> para personalizar o painel.</div>`:''}`}
function evolution(){return `<div class="grid two">${card('Registrar pesagem',form('weights',input('Data','date','date',true,`value="${today()}"`)+input('Peso (kg)','kg','number',true,'min="1" max="500" step="0.1"'),'Salvar peso'))}${card('Histórico do peso',entries('weights',x=>`<strong>${safe(x.kg)} kg</strong><small>${fmt(x.date)}</small>`))}</div><div class="grid two">${card('Gráfico de evolução',chart())}${card('Medidas corporais',form('measurements',input('Data','date','date',true,`value="${today()}"`)+input('Cintura (cm)','cintura','number',false,'step="0.1"')+input('Abdômen (cm)','abdomen','number',false,'step="0.1"')+input('Quadril (cm)','quadril','number',false,'step="0.1"')+input('Braço (cm)','braco','number',false,'step="0.1"')+input('Coxa (cm)','coxa','number',false,'step="0.1"')+input('Busto (cm)','busto','number',false,'step="0.1"'))+`<div style="margin-top:18px">${entries('measurements',x=>`<strong>${fmt(x.date)}</strong><small>Cintura ${val(x.cintura,' cm')} · Abdômen ${val(x.abdomen,' cm')} · Quadril ${val(x.quadril,' cm')} · Braço ${val(x.braco,' cm')} · Coxa ${val(x.coxa,' cm')} · Busto ${val(x.busto,' cm')}</small>`)}</div>`)}</div>`}
function diet(){const meals=['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia'];return `<div class="grid two">${card('Adicionar refeição',form('meals',input('Data','date','date',true,`value="${today()}"`)+select('Tipo de refeição','type',meals)+input('Alimentos / descrição','food','text',true)+input('Porção / quantidade','portion')+input('Calorias estimadas (opcional)','cal','number',false,'min="0"')+input('Proteínas (g, opcional)','protein','number',false,'min="0" step="0.1"')+input('Carboidratos (g, opcional)','carbs','number',false,'min="0" step="0.1"')+input('Gorduras (g, opcional)','fat','number',false,'min="0" step="0.1"'))}${card('Diário alimentar',entries('meals',x=>`<strong>${safe(x.type)} · ${safe(x.food)}</strong><small>${fmt(x.date)} · ${safe(x.portion||'Sem porção informada')} ${x.cal?'· '+safe(x.cal)+' kcal':''}</small>`))}</div><div class="notice">🥗 Faça refeições variadas e adequadas às suas necessidades. Se houver redução importante do apetite ou sintomas gastrointestinais, converse com seu médico ou nutricionista. Este site não prescreve dietas.</div>`}
function water(){let w=waterToday(),g=num(db.profile.waterGoal)||2000;return `<div class="grid two">${card('Hidratação de hoje',`<div class="statvalue">${w} <span style="font-size:16px">ml</span></div><p class="muted">Meta configurada: ${g} ml</p><div class="progress"><div style="width:${Math.min(100,w/g*100)}%"></div></div><div class="actions"><button class="btn secondary" onclick="quickWater(200)">+ 200 ml</button><button class="btn secondary" onclick="quickWater(300)">+ 300 ml</button><button class="btn secondary" onclick="quickWater(500)">+ 500 ml</button></div><p class="mini muted">A meta é configurável e não representa recomendação médica.</p>`)}${card('Adicionar água',form('water',input('Data','date','date',true,`value="${today()}"`)+input('Quantidade (ml)','ml','number',true,'min="1" max="5000"'),'Registrar água'))}</div>${card('Histórico de hidratação',entries('water',x=>`<strong>${safe(x.ml)} ml</strong><small>${fmt(x.date)}</small>`))}`}
function quickWater(ml){db.water.push({id:crypto.randomUUID(),date:today(),ml:String(ml)});save();render()}
function workouts(){return `<div class="grid two">${card('Registrar atividade',form('workouts',input('Data','date','date',true,`value="${today()}"`)+select('Modalidade','type',['Caminhada','Musculação','Corrida','Bicicleta','Pilates','Alongamento','Treino em casa','Outro'])+input('Duração (minutos)','minutes','number',true,'min="1" max="1000"')+input('Observações','notes')))}${card('Histórico de treinos',entries('workouts',x=>`<strong>${safe(x.type)} · ${safe(x.minutes)} min</strong><small>${fmt(x.date)} · ${safe(x.notes||'')}</small>`))}</div><div class="notice">🏋️ Treinos de força podem ajudar a preservar a massa muscular durante o emagrecimento. Ajuste a intensidade à sua condição física e orientação profissional.</div>`}
function treatment(){return `<div class="grid two">${card('Registrar aplicação realizada',form('doses',input('Data da aplicação','date','date',true,`value="${today()}"`)+input('Dose prescrita (mg)','mg','number',true,'min="0.1" step="0.1"')+select('Local da aplicação','site',['Abdômen','Coxa','Braço','Outro'])+input('Observações','notes'),'Salvar aplicação'))}${card('Histórico de aplicações',entries('doses',x=>`<strong>${safe(x.mg)} mg · ${safe(x.site)}</strong><small>${fmt(x.date)} · ${safe(x.notes||'')}</small>`))}</div><div class="grid two">${card('Diário de sintomas',form('symptoms',input('Data','date','date',true,`value="${today()}"`)+select('Sintoma','type',['Náusea','Constipação','Diarreia','Vômito','Desconforto abdominal','Alteração no apetite','Outro'])+select('Intensidade','level',['Leve','Moderada','Intensa'])+input('Observações','notes'),'Salvar sintoma'))}${card('Histórico de sintomas',entries('symptoms',x=>`<strong>${safe(x.type)} · ${safe(x.level)}</strong><small>${fmt(x.date)} · ${safe(x.notes||'')}</small>`))}</div><div class="notice">⚕️ Esta área registra o uso conforme prescrição e não recomenda doses, mudanças de esquema ou ajustes. Sintomas intensos, persistentes ou sinais de desidratação exigem avaliação médica. Em caso de sintomas graves, procure atendimento imediatamente.</div>`}
function calendar(){const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+calOffset,1),year=d.getFullYear(),month=d.getMonth(),start=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate(),names=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];let html=names.map(x=>`<div class="mini muted" style="text-align:center;font-weight:700">${x}</div>`).join('');for(let i=0;i<42;i++){let day=i-start+1,valid=day>0&&day<=days,n=valid?day:day<1?prev+day:day-days,date=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,count=[['weights',''],['workouts','blue'],['doses','pink'],['events','']].flatMap(([k,c])=>db[k].filter(x=>x.date===date).map(()=>`<span class="dot ${c}"></span>`));html+=`<div class="day ${valid?'':'dim'} ${date===today()?'today':''}">${n}<div class="dots">${count.slice(0,7).join('')}</div></div>`}return `${card('Calendário mensal',`<div class="row" style="margin-bottom:20px"><button class="btn secondary small" onclick="calOffset--;render()">← Anterior</button><strong>${d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong><button class="btn secondary small" onclick="calOffset++;render()">Próximo →</button></div><div class="calendar">${html}</div><div class="actions mini muted" style="margin-top:15px"><span>🟢 Peso / evento</span><span>🔵 Treino</span><span>🟠 Aplicação</span></div>`)}<div class="grid two">${card('Adicionar compromisso',form('events',input('Data','date','date',true,`value="${today()}"`)+input('Título','title','text',true)+select('Categoria','type',['Consulta','Meta pessoal','Lembrete','Outro']),'Salvar compromisso'))}${card('Compromissos',entries('events',x=>`<strong>${safe(x.title)}</strong><small>${fmt(x.date)} · ${safe(x.type)}</small>`))}</div>`}
function achievements(){const achievements=[['🌱','Primeiro passo',db.weights.length>0],['💧','Hidratação registrada',db.water.length>0],['🥗','Primeira refeição',db.meals.length>0],['🏃','Movimento iniciado',db.workouts.length>0],['📅','Rotina organizada',db.events.length>0],['🌿','7 pesagens registradas',db.weights.length>=7]];return `<div class="grid three">${achievements.map(([ico,name,done])=>`<div class="card" style="text-align:center;opacity:${done?1:.55}"><div style="font-size:43px">${ico}</div><h3 style="margin-top:15px">${name}</h3><span class="badge">${done?'Conquistada ✓':'Ainda não conquistada'}</span></div>`).join('')}</div><div class="notice">✨ Seu valor não depende do número na balança. Consistência e autocuidado importam mais que perfeição.</div>`}
function reports(){return `${card('Resumo do acompanhamento',`<div class="grid stats">${metric('Pesagens',db.weights.length,'Registros')}${metric('Refeições',db.meals.length,'Registros')}${metric('Treinos',db.workouts.length,'Atividades')}${metric('Aplicações',db.doses.length,'Registros')}</div><div class="actions" style="margin-top:20px"><button class="btn" onclick="window.print()">Imprimir / salvar em PDF</button><button class="btn secondary" onclick="exportData()">Exportar dados (JSON)</button></div><p class="mini muted">O arquivo JSON permite guardar uma cópia de segurança dos seus registros.</p>`)}${card('Evolução do peso',chart())}`}
function exportData(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='minha-evolucao-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d.profile||!Array.isArray(d.weights))throw Error();if(confirm('Substituir os registros atuais pelo arquivo importado?')){db={...defaults,...d};save();render()}}catch{alert('Arquivo de backup inválido.')}};reader.readAsText(file)}
function profile(){const p=db.profile;return `<div class="grid two">${card('Informações pessoais',`<form class="formgrid" onsubmit="event.preventDefault();const f=new FormData(this);for(const [k,v] of f)db.profile[k]=v;save();render();alert('Perfil salvo!')">${input('Seu nome','name','text',false,`value="${safe(p.name)}"`)}${input('Altura (cm)','height','number',false,`min="50" max="250" value="${safe(p.height)}"`)}${input('Peso inicial (kg)','initial','number',false,`min="1" step="0.1" value="${safe(p.initial)}"`)}${input('Peso desejado (kg)','goal','number',false,`min="1" step="0.1" value="${safe(p.goal)}"`)}${input('Meta diária de água (ml)','waterGoal','number',false,`min="100" step="50" value="${safe(p.waterGoal)}"`)}<button class="btn" type="submit">Salvar perfil</button></form>`)}${card('Seus dados e privacidade',`<p class="muted">Nesta versão, seus registros são guardados <strong>apenas neste navegador e neste dispositivo</strong>, usando armazenamento local. Não há conta, sincronização ou servidor.</p><p class="muted">Evite usar em dispositivos compartilhados. Limpar dados do navegador pode apagar seu histórico.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Baixar backup</button><label class="btn secondary" style="cursor:pointer">Importar backup<input type="file" accept=".json" onchange="importData(this)" hidden></label><button class="btn ghost" onclick="clearData()">Apagar meus dados</button></div>`)}</div>`}function clearData(){if(confirm('Apagar definitivamente todos os dados deste navegador? Faça um backup antes, se desejar.')){localStorage.removeItem(KEY);db=structuredClone(defaults);render()}}function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';save();render()}
function render(){document.body.classList.toggle('dark',db.theme==='dark');document.getElementById('datehead').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('nav').innerHTML=menus.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');const item=menus.find(x=>x[0]===tab);document.getElementById('pagetitle').textContent=tab==='inicio'?'Meu painel':item[1].replace(/^[^ ]+ /,'');document.getElementById('pagesub').textContent=item[2];document.getElementById('avatar').textContent=(db.profile.name||'EU').trim().split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join('');document.getElementById('content').innerHTML=({inicio:dashboard,evolucao:evolution,dieta:diet,agua:water,treinos:workouts,tratamento:treatment,calendario:calendar,conquistas:achievements,relatorios:reports,perfil:profile}[tab])()}render();
</script></body></html>
